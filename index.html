<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pilih masa</title>
<!-- Teach In Bot Mini App: ⏰ Pilih masa (since bot 1.52, his order 26 Nov 2026: snappy like the Teach In App).
     Source: claudenazagihanMP/teachin-mini/index.html. Published on GitHub Pages (repo teach-in-bot-mini-app).
     No secret here: the bot's address comes in the link (?a=), and the bot checks Telegram's signature. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#26282c;--card:#30333a;--text:#d8dbe0;--dim:#9aa0a8;--off:#3c4048;--red:#f47c8c;--redText:#2b1216}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{padding:12px 12px 24px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.card{background:var(--card);border-radius:12px;padding:14px}
h1{font-size:19px;margin:0 0 2px;line-height:1.3}
.day{color:var(--dim);font-size:15px;margin-bottom:10px}
.hint{color:var(--dim);font-size:15px;font-weight:600;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;touch-action:none}
.w{border:0;border-radius:10px;padding:9px 4px;background:var(--off);color:var(--text);font:inherit;text-align:center;min-height:56px;cursor:pointer}
.w b{display:block;font-size:17px}
.w small{display:block;font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.w.on{background:var(--red);color:var(--redText)}
.msg{text-align:center;padding:36px 12px;color:var(--dim);font-size:17px;line-height:1.5}
.err{color:#e8a3a3;text-align:center;font-size:16px;margin-top:12px;min-height:20px}
#send{display:none;width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:#5b8f6a;color:#fff;font:inherit;font-size:17px;font-weight:700}
</style>
</head>
<body>
<div id="app" class="msg">⏳ Sedang memuat waktu...</div>
<button id="send">Submit</button>
<div id="err" class="err"></div>
<script>
(function () {
  var tg = window.Telegram && Telegram.WebApp, q = new URLSearchParams(location.search);
  var dep = (q.get('a') || '').replace(/[^A-Za-z0-9_-]/g, '');
  var p = q.get('p') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || q.get('tgWebAppStartParam') || '';
  var api = 'https://script.google.com/macros/s/' + dep + '/exec', on = {}, slots = [], busy = false;
  var $ = function (id) { return document.getElementById(id); };
  function say(t) { $('app').className = 'msg'; $('app').textContent = t; }
  function call(o) {
    var u = api + '?' + Object.keys(o).map(function (k) { return k + '=' + encodeURIComponent(o[k]); }).join('&');
    return fetch(u).then(function (r) { return r.json(); });
  }
  if (!tg || !tg.initData || !dep || !p) { say('Buka halaman ini dari mesej Teach In Bot (⏰ Pilih masa).'); return; }
  tg.ready(); tg.expand && tg.expand();
  if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();   // a swipe over the waktu must not close the page
  try { tg.setHeaderColor('#26282c'); tg.setBackgroundColor('#26282c'); } catch (e) {}
  var mb = tg.MainButton, useMain = !!(mb && tg.isVersionAtLeast && tg.isVersionAtLeast('6.0'));
  call({ mini: 'view', p: p, init: tg.initData }).then(function (d) {
    if (d.err) { say(d.err); return; }
    slots = d.slots; d.on.forEach(function (s) { on[s] = 1; });
    draw(d);
    if (useMain) { mb.setParams({ text: 'Submit', is_visible: true, is_active: true }); mb.onClick(send); }
    else $('send').style.display = 'block';
  }).catch(function () { say('Tiada sambungan internet. Tutup dan cuba lagi.'); });

  function draw(d) {
    var h = '<div class="card"><h1>' + esc(d.who.join(', ')) + '</h1><div class="day">' + esc(d.day) + '</div>' +
      '<div class="hint">merah=guru itu tiada di sekolah masa itu</div><div class="grid" id="grid">' +
      slots.map(function (x) {
        var c = x.cls === null ? '' : '<small>' + esc(x.cls || 'tiada kelas') + '</small>';
        return '<button class="w' + (on[x.s] ? ' on' : '') + '" data-s="' + x.s + '"><b>' + esc(x.tm) + '</b>' + c + '</button>';
      }).join('') + '</div></div>';
    $('app').className = ''; $('app').innerHTML = h;
    hook();
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  // Tap = one waktu on or off. Press and swipe = every waktu the finger passes gets the same colour.
  function hook() {
    var grid = $('grid'), paint = null;
    function set(b) {
      if (!b || paint === null) return;
      var s = +b.dataset.s; if (!!on[s] === paint) return;
      if (paint) on[s] = 1; else delete on[s];
      b.classList.toggle('on', paint);
      try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
      $('err').textContent = '';
    }
    function at(e) { var el = document.elementFromPoint(e.clientX, e.clientY); return el && el.closest ? el.closest('.w') : null; }
    grid.addEventListener('pointerdown', function (e) {
      var b = at(e); if (!b || busy) return;
      e.preventDefault(); paint = !on[+b.dataset.s]; set(b);
    });
    window.addEventListener('pointermove', function (e) { if (paint !== null) set(at(e)); });
    ['pointerup', 'pointercancel'].forEach(function (n) { window.addEventListener(n, function () { paint = null; }); });
  }
  function send() {
    if (busy) return;
    var s = Object.keys(on).map(Number).sort(function (a, b) { return a - b; });
    if (!s.length) { $('err').textContent = 'Tap sekurang-kurangnya satu waktu.'; return; }
    busy = true;
    if (useMain) mb.showProgress(false); else { $('send').disabled = true; $('send').textContent = '⏳ Sedang menghantar...'; }
    call({ mini: 'set', p: p, init: tg.initData, s: s.join(',') }).then(function (d) {
      if (d.ok) { tg.close(); return; }
      fail(d.err || 'Cuba lagi.');
    }).catch(function () { fail('Tiada sambungan internet. Cuba lagi.'); });
  }
  function fail(t) {
    busy = false; $('err').textContent = t;
    if (useMain) mb.hideProgress(); else { $('send').disabled = false; $('send').textContent = 'Submit'; }
  }
  $('send').onclick = send;
})();
</script>
</body>
</html>
